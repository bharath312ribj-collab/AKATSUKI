<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reach Check</title>
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#14213A;--muted:#4D5B75;--line:#CFD8E5;
  --brand:#0A6B67;--onbrand:#FFFFFF;--soft:#E7F1F0;--focus:#1D4ED8;
  --c-crit:#A81F14;--b-crit:#FBE3E0;--c-high:#A2400B;--b-high:#FDE9DA;
  --c-med:#7A5600;--b-med:#FBF0CC;--c-ok:#17663D;--b-ok:#E1F3E8;--c-low:#3F4E69;--b-low:#E8ECF3;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Tamil","Noto Sans","Latha",Roboto,sans-serif;
  font-size:1rem;line-height:1.55}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .75rem}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:var(--onbrand);padding:.6rem 1rem;z-index:10}
.skip:focus{left:.5rem;top:.5rem}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 1rem}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;padding-top:.9rem;padding-bottom:.9rem}
.brand{display:flex;align-items:center;gap:.7rem}
.brand svg{color:var(--brand)}
.brand b{font-size:1.3rem;display:block;line-height:1.1}
.brand span{color:var(--muted);font-size:.9rem}
.prefs{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.prefs label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.55rem .65rem;min-height:44px;width:100%}
.prefs select{width:auto;min-height:36px;padding:.25rem .4rem}
textarea{min-height:110px;resize:vertical}
.roles{display:flex;gap:.5rem;padding:.75rem 0}
.roles button{flex:1;max-width:260px}
.btn{font:inherit;font-weight:600;min-height:44px;padding:.5rem 1rem;border-radius:8px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);cursor:pointer}
.btn.primary,.btn[aria-pressed="true"],.btn[aria-current="page"]{background:var(--brand);color:var(--onbrand)}
.btn.sm{min-height:36px;padding:.2rem .7rem;font-size:.9rem}
.btn.plain{border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav.sub{display:flex;flex-wrap:wrap;gap:.4rem;margin:.25rem 0 1rem}
main{padding-bottom:2rem;outline:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.field{margin-bottom:1rem}
.field label,.field legend{display:block;font-weight:600;margin-bottom:.3rem}
.field.bad select,.field.bad input,.field.bad textarea{border-color:var(--c-crit)}
.err{color:var(--c-crit);font-weight:600;margin:.3rem 0 0;font-size:.92rem}
.hint{color:var(--muted);font-size:.9rem}
.check{display:flex;gap:.6rem;align-items:flex-start}
.check input{width:24px;height:24px;margin-top:.15rem;flex:none}
.banner{border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem;font-weight:600}
.banner.ok{background:var(--b-ok);color:var(--c-ok)}
.banner.err{background:var(--b-crit);color:var(--c-crit)}
.badge{display:inline-block;border-radius:999px;padding:.05rem .65rem;font-size:.85rem;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.s-Critical{color:var(--c-crit);background:var(--b-crit)}
.s-High{color:var(--c-high);background:var(--b-high)}
.s-Medium{color:var(--c-med);background:var(--b-med)}
.s-Low,.s-None{color:var(--c-low);background:var(--b-low)}
.s-OK{color:var(--c-ok);background:var(--b-ok)}
.bars{width:34px;height:28px;flex:none}
.bars rect{fill:currentColor}.bars .off{opacity:.2}
.h-4{color:var(--c-ok)}.h-3{color:var(--c-med)}.h-2{color:var(--c-high)}.h-1{color:var(--c-crit)}
.svc{display:flex;gap:.8rem;align-items:flex-start}
.svc h3{margin-bottom:.15rem}
.kpi b{display:block;font-size:2rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.92rem}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--soft);white-space:nowrap}
td.cell{text-align:center;white-space:nowrap;font-weight:600}
.alert{border-left:6px solid var(--line)}
.alert.s-Critical{border-left-color:var(--c-crit)}.alert.s-High{border-left-color:var(--c-high)}.alert.s-Medium{border-left-color:var(--c-med)}
.alert{background:var(--surface);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.meta{color:var(--muted);font-size:.9rem}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:.7rem;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.steps .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none}
.steps .done .dot{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.steps .now .dot{border-color:var(--brand);color:var(--brand)}
details.card summary{font-weight:700;cursor:pointer;min-height:32px}
.filters{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
.filters label{font-size:.85rem;color:var(--muted);display:block}
.filters select{width:auto;min-width:140px}
.idbig{font-size:2rem;font-weight:800;letter-spacing:.04em}
textarea.report{min-height:380px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:1rem 0 1.5rem}
@media (max-width:560px){h1{font-size:1.3rem}.roles button{max-width:none}}
@media print{header.top,nav,.roles,footer,.btn{display:none!important}}

body{background:#fff}
h1{font-size:2.1rem;font-weight:800}h2{font-size:1.6rem;font-weight:800}h3{font-size:1.3rem;font-weight:800}
.wm{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:no-repeat;background-position:center 55%;background-size:min(70vw,440px);opacity:.07}
header.top,main,footer,.wrap{position:relative;z-index:1}
.logo{width:60px;height:60px;object-fit:contain}
.gate{max-width:560px;margin:0 auto;padding:2rem 1rem;text-align:center;position:relative;z-index:1}
.gate .logo{width:130px;height:130px}
.bigbtn{display:block;width:100%;font:inherit;font-size:1.5rem;font-weight:800;min-height:72px;margin:.8rem 0;border-radius:14px;border:3px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer}
.bigbtn.fill{background:var(--brand);color:#fff}
.sub .btn{font-size:1.1rem;min-height:52px}
.vbar{position:fixed;right:.75rem;bottom:.75rem;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:1.1rem}
.leg{list-style:none;padding:0;margin:.5rem 0}.leg li{display:flex;gap:.5rem;align-items:center;margin:.2rem 0}.leg i{width:16px;height:16px;border-radius:3px;display:inline-block;flex:none}
.dot2{background:var(--c-crit);color:#fff;border-radius:999px;padding:0 .5rem;font-size:.85rem;margin-left:.4rem}
.unread{border-left:6px solid var(--brand)}
</style>
</head>

/* ---------- detection engine ---------- */
function latestTests(){
  var m={};
  state.tests.forEach(function(x){var k=x.svc+'|'+x.area;if(!m[k]||x.when>m[k].when)m[k]=x});
  return Object.keys(m).map(function(k){return m[k]});
}
function testFlags(x){
  var f=[],a=areaName(x.area),net=areaNet(x.area);
  if(x.sec>10)f.push(['LOAD','Critical','Loads in '+x.sec+' s on '+net+' in '+a+' (limit 5 s)']);
  else if(x.sec>5)f.push(['LOAD','High','Loads in '+x.sec+' s on '+net+' in '+a+' (limit 5 s)']);
  if(x.kb>1024)f.push(['SIZE','Medium','Page weighs '+(x.kb/1024).toFixed(1)+' MB (limit 1 MB)']);
  if(x.mb>2)f.push(['DATA','Medium','Uses '+x.mb+' MB per task (limit 2 MB)']);
  if(x.at===false)f.push(['AT','Critical','Screen reader task failed in '+a]);
  return f;
}
function candidates(){
  var out=[],n=now(),lt=latestTests();
  state.services.forEach(function(s){
    var grp={};
    lt.filter(function(x){return x.svc===s.id}).forEach(function(x){
      testFlags(x).forEach(function(f){(grp[f[0]]=grp[f[0]]||[]).push({x:x,sev:f[1],detail:f[2]})});
    });
    Object.keys(grp).forEach(function(rule){
      var g=grp[rule],worst=g[0];
      g.forEach(function(i){if(RANK[i.sev]>RANK[worst.sev]||(RANK[i.sev]===RANK[worst.sev]&&i.x.sec>worst.x.sec))worst=i});
      var areas=[];g.forEach(function(i){var nm=areaName(i.x.area);if(areas.indexOf(nm)<0)areas.push(nm)});
      out.push({key:s.id+'|'+rule,kind:'risk',sev:worst.sev,svc:s.id,rule:rule,areas:areas,
        detail:worst.detail+(g.length>1?' · '+g.length+' areas affected':''),action:ACTIONS[rule],
        occurredAt:Math.max.apply(null,g.map(function(i){return i.x.when}))});
    });
    if(!s.offline&&!s.sms)out.push({key:s.id+'|OFFLINE',kind:'risk',sev:'Medium',svc:s.id,rule:'OFFLINE',areas:[],detail:'No offline, text-only or SMS option',action:ACTIONS.OFFLINE,occurredAt:s.checkedAt});
    if(s.contrast<4.5)out.push({key:s.id+'|CONTRAST',kind:'risk',sev:'High',svc:s.id,rule:'CONTRAST',areas:[],detail:'Lowest colour contrast is '+s.contrast+':1 (needs 4.5:1)',action:ACTIONS.CONTRAST,occurredAt:s.checkedAt});
    if(s.wcag>0)out.push({key:s.id+'|WCAG',kind:'risk',sev:'High',svc:s.id,rule:'WCAG',areas:[],detail:s.wcag+' critical WCAG A/AA failure'+(s.wcag>1?'s':''),action:ACTIONS.WCAG,occurredAt:s.checkedAt});
    if(s.uptime<99)out.push({key:s.id+'|UPTIME',kind:'risk',sev:s.uptime<95?'High':'Medium',svc:s.id,rule:'UPTIME',areas:[],detail:'Uptime '+s.uptime+'% (target 99%), error rate '+s.err+'%',action:ACTIONS.UPTIME,occurredAt:s.checkedAt});
    var blind=state.areas.filter(function(a){return !lt.some(function(x){return x.svc===s.id&&x.area===a.id})});
    if(blind.length)out.push({key:s.id+'|BLIND',kind:'gap',sev:'Low',svc:s.id,rule:'BLIND',areas:blind.map(function(a){return a.name}),detail:'Never tested in '+blind.length+' area'+(blind.length>1?'s':''),action:ACTIONS.BLIND,occurredAt:s.checkedAt});
  });
  var groups={};
  state.tickets.forEach(function(k){if(n-k.createdAt<=7*D)(groups[k.svc+'|'+k.area]=groups[k.svc+'|'+k.area]||[]).push(k)});
  Object.keys(groups).forEach(function(g){
    var arr=groups[g].sort(function(a,b){return a.createdAt-b.createdAt});
    if(arr.length>=5){var p=g.split('|');
      out.push({key:p[0]+'|CLUSTER|'+p[1],kind:'risk',sev:'High',svc:p[0],rule:'CLUSTER',areas:[areaName(p[1])],detail:arr.length+' user reports in 7 days from '+areaName(p[1]),action:ACTIONS.CLUSTER,occurredAt:arr[4].createdAt});}
  });
  state.tickets.filter(function(k){return !k.dupOf}).forEach(function(k){
    if(k.status==='Open'&&n-k.createdAt>24*H)out.push({key:'GAP|UNASSIGNED|'+k.id,kind:'gap',sev:'High',svc:k.svc,rule:'UNASSIGNED',areas:[areaName(k.area)],detail:'Ticket '+k.id+' unassigned for '+dur(n-k.createdAt)+' (limit 24 h)',action:ACTIONS.UNASSIGNED,occurredAt:k.createdAt+24*H});
    if(k.status==='Resolved'&&k.resolvedAt&&n-k.resolvedAt>48*H)out.push({key:'GAP|NORETEST|'+k.id,kind:'gap',sev:'Medium',svc:k.svc,rule:'NORETEST',areas:[areaName(k.area)],detail:'Ticket '+k.id+' fixed '+dur(n-k.resolvedAt)+' ago, no re-test yet',action:ACTIONS.NORETEST,occurredAt:k.resolvedAt+48*H});
  });
  return out;
}
function syncAlerts(seedMode){
  var c=candidates(),n=now(),keys={};
  c.forEach(function(x){
    keys[x.key]=1;
    var idx=-1;state.alerts.forEach(function(a,i){if(a.key===x.key)idx=i});
    var a=idx>=0?state.alerts[idx]:null;
    if(a&&a.status!=='closed'){a.sev=x.sev;a.detail=x.detail;a.areas=x.areas;a.action=x.action;return}
    var na={key:x.key,kind:x.kind,sev:x.sev,svc:x.svc,rule:x.rule,areas:x.areas,detail:x.detail,action:x.action,occurredAt:x.occurredAt,
      detectedAt:n,ackedAt:null,status:'open',label:null,closedAt:null};
    if(seedMode){
      var h=hs(x.key);
      na.detectedAt=x.occurredAt+(10+h%80)*60000;
      var ackIt=(x.sev==='Critical'&&x.key!=='S5|AT')||(x.sev!=='Critical'&&h%3!==0);
      if(ackIt){na.ackedAt=na.detectedAt+(30+h%150)*60000;na.status='ack';na.label=SEED_FP[x.key]?'fp':'tp'}
    }
    if(a)state.alerts[idx]=na;else state.alerts.push(na);
  });
  state.alerts.forEach(function(a){if(a.status!=='closed'&&!keys[a.key]){a.status='closed';a.closedAt=n}});
}

/* ---------- helpers ---------- */
function dur(ms){ms=Math.abs(ms);var m=ms/60000;if(m<60)return Math.max(1,Math.round(m))+' min';var h=m/60;if(h<72)return (h<10?h.toFixed(1):Math.round(h))+' h';return Math.round(h/24)+' d'}

function opt(list,sel,lbl){return list.map(function(o){var v=o[0],l=o[1];return '<option value="'+esc(v)+'"'+(String(sel)===String(v)?' selected':'')+'>'+esc(l)+'</option>'}).join('')}

function health(id){

  s=Math.max(0,s);return {score:s,n:s>=85?4:s>=65?3:s>=40?2:1};
}

function dueOf(a){return a.detectedAt+SLA_A[a.sev]}
function overdue(a){return a.status==='open'&&now()>dueOf(a)}

function dupCount(id){return state.tickets.filter(function(k){return k.dupOf===id}).length}
function ticketSLA(k){var lim=SLA_T[TYPES[k.type].sev];var end=k.resolvedAt||now();return {lim:lim,breach:(end-k.createdAt)>lim,left:lim-(now()-k.createdAt)}}
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}

function evalMetrics(){
  var al=state.alerts;
  var tp=al.filter(function(a){return a.label==='tp'}).length,fp=al.filter(function(a){return a.label==='fp'}).length,fn=state.missed;
  var P=tp+fp?tp/(tp+fp):null,R=tp+fn?tp/(tp+fn):null,F=(P&&R)?2*P*R/(P+R):null;
  var mttd=mean(al.map(function(a){return a.detectedAt-a.occurredAt}));
  var mtta=mean(al.filter(function(a){return a.ackedAt}).map(function(a){return a.ackedAt-a.detectedAt}));
  var prim=primary(),res=prim.filter(function(k){return k.resolvedAt});
  var mttr=mean(res.map(function(k){return k.resolvedAt-k.createdAt}));
  var mttrC=mean(res.filter(function(k){return TYPES[k.type].sev==='Critical'}).map(function(k){return k.resolvedAt-k.createdAt}));
  var met=0,br=0;
  prim.forEach(function(k){var lim=SLA_T[TYPES[k.type].sev];if(k.resolvedAt){(k.resolvedAt-k.createdAt<=lim)?met++:br++}else if(now()-k.createdAt>lim)br++});
  var lb=state.tests.filter(function(x){var n=areaNet(x.area);return n==='2G'||n==='3G'});
  var atT=state.tests.filter(function(x){return x.at!==null});
  var fixed=prim.filter(function(k){return k.status==='Resolved'||k.status==='Verified'});
  var ver=prim.filter(function(k){return k.status==='Verified'});
  var rated=state.tickets.filter(function(k){return k.rating});
  var lt=latestTests(),pairs=state.services.length*state.areas.length;
  return {tp:tp,fp:fp,fn:fn,unl:al.filter(function(a){return !a.label}).length,P:P,R:R,F:F,FA:(tp+fp)?fp/(tp+fp):null,
    mttd:mttd,mtta:mtta,mttr:mttr,mttrC:mttrC,sla:(met+br)?met/(met+br):null,
    tcLB:lb.length?lb.filter(function(x){return x.done}).length/lb.length:null,
    tcAT:atT.length?atT.filter(function(x){return x.at}).length/atT.length:null,
    mb:mean(state.tests.map(function(x){return x.mb})),
    verRate:fixed.length?ver.length/fixed.length:null,
    sat:rated.length?mean(rated.map(function(k){return k.rating})):null,
    cov:pairs?lt.length/pairs:null};
}
function evalRows(m){
  var HR=H/1;
  function ok(v,test){return v==null?null:test(v)}
  return [
   ['Detection accuracy','Precision (correct alerts ÷ all alerts)',pct(m.P),'≥ 85%',ok(m.P,function(v){return v>=.85})],
   ['Detection accuracy','Recall (real issues found ÷ all real issues)',pct(m.R),'≥ 90%',ok(m.R,function(v){return v>=.9})],
   ['Detection accuracy','F1-score',m.F==null?'—':m.F.toFixed(2),'≥ 0.87',ok(m.F,function(v){return v>=.87})],
   ['Detection accuracy','False alarm rate',pct(m.FA),'≤ 10%',ok(m.FA,function(v){return v<=.10})],
   ['Response time','MTTD (mean time to detect)',m.mttd==null?'—':dur(m.mttd),'< 1 h',ok(m.mttd,function(v){return v<HR})],
   ['Response time','MTTA (mean time to acknowledge)',m.mtta==null?'—':dur(m.mtta),'< 4 h',ok(m.mtta,function(v){return v<4*HR})],
   ['Response time','MTTR for critical tickets',m.mttrC==null?'—':dur(m.mttrC),'< 48 h',ok(m.mttrC,function(v){return v<48*HR})],
   ['Response time','MTTR for all tickets',m.mttr==null?'—':dur(m.mttr),'tracked',null],
   ['Response time','SLA compliance',pct(m.sla),'≥ 90%',ok(m.sla,function(v){return v>=.9})],
   ['Service effectiveness','Task completion on 2G/3G',pct(m.tcLB),'≥ 90%',ok(m.tcLB,function(v){return v>=.9})],
   ['Service effectiveness','Task completion with assistive tech',pct(m.tcAT),'≥ 85%',ok(m.tcAT,function(v){return v>=.85})],
   ['Service effectiveness','Average data per task',m.mb==null?'—':m.mb.toFixed(1)+' MB','≤ 2 MB',ok(m.mb,function(v){return v<=2})],
   ['Service effectiveness','Fix verification rate (fixed and re-tested)',pct(m.verRate),'100%',ok(m.verRate,function(v){return v>=.999})],
   ['Service effectiveness','User satisfaction after fix',m.sat==null?'—':m.sat.toFixed(1)+' / 5','≥ 4 / 5',ok(m.sat,function(v){return v>=4})],
   ['Service effectiveness','Coverage (service × area pairs tested)',pct(m.cov),'≥ 90%',ok(m.cov,function(v){return v>=.9})]
  ];
}

    else if(tk.status==='Assigned'){tk.startedAt=n;tk.status='In progress'}
    else if(tk.status==='In progress'){tk.resolvedAt=n;tk.status='Resolved'}
    else if(tk.status==='Resolved'){tk.verifiedAt=n;tk.status='Verified'}
    syncAlerts();save();ui.msg=null;render();say(tk.id+' is now '+tk.status);
  }
  else if(a==='fix'){
    tk=findTicket(b.dataset.id);if(!tk)return;
    if(v==='yes'){var r=document.getElementById('rate');tk.userOk=true;tk.rating=r?parseInt(r.value,10):null;ui.trackMsg=t('thanksYes')}
    else{tk.status='In progress';tk.resolvedAt=null;tk.userOk=false;ui.trackMsg=t('reopened')}
    syncAlerts();save();render();say(ui.trackMsg);
  }
  else if(a==='missed'){state.missed++;save();ui.evalMsg='Missed issue logged. Recall has been updated.';render();say(ui.evalMsg)}
  else if(a==='copy'){
    var ta=document.getElementById('rep'),txt=ta?ta.value:'';
    var done=function(ok){ui.msg=ok?{kind:'ok',text:'Report copied.'}:{kind:'err',text:'Could not copy automatically. Select the text and copy it manually.'};render();say(ui.msg.text)};
    try{navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)})}catch(x){done(false)}
  }
  else if(a==='reset'){try{localStorage.removeItem(KEY)}catch(x){}ui.done=null;ui.track='';seed();ui.msg={kind:'ok',text:'Sample data restored.'};render()}
});

window.addEventListener('error',function(ev){var m=document.getElementById('main')||document.body;var d=document.createElement('div');d.className='banner err';d.setAttribute('role','alert');d.textContent='Page error: '+ev.message+' (line '+ev.lineno+')';m.insertBefore(d,m.firstChild)});
/* ---------- init ---------- */
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.v===1&&p.services)state=p}}catch(e){state=null}
if(!state)seed();if(!state.notifs)state.notifs=[];ui.theme='light';
if(state.prefs){ui.lang=state.prefs.lang||'en';ui.size=state.prefs.size||'normal';ui.theme=state.prefs.theme||'auto'}
syncAlerts();
render();
})();
</script>
</body>
</html>
